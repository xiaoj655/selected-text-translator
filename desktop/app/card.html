<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;">
  <meta name="color-scheme" content="light dark">
  <title>Selected Text Translator</title>
  <link rel="stylesheet" href="./card.css">
</head>
<body>
  <div class="card" id="card">
    <div class="card-head">
      <span class="tag">Translation</span>
      <span class="src" id="src" title=""></span>
      <span class="spacer"></span>
      <button id="btn-pin" type="button" title="Keep this window on top. Press Esc or click × to close." aria-label="Pin window">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
      </button>
      <button id="btn-popout" type="button" title="Open in main window" aria-label="Open in main window">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
      </button>
      <button id="btn-close" type="button" title="Close · Esc" aria-label="Close">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="result is-loading" id="result" role="status">Translating…</div>
    <div class="actions" id="actions"></div>
  </div>
  <div class="selection-toolbar" id="selection-toolbar" role="toolbar" aria-label="Selected text actions" hidden>
    <button type="button" data-sel-action="copy" title="Copy selected text">Copy</button>
    <button type="button" data-sel-action="speak" title="Listen to selected text">Listen</button>
    <button type="button" data-sel-action="translate" title="Translate selected text">Translate</button>
    <button type="button" data-sel-action="save" title="Save selected text">Save</button>
  </div>
  <script type="module" src="./card.js"></script>
</body>
</html>
