<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;">
  <title>Selected Text Translator</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-dot"></span><h1>Selected Text Translator</h1></div>
      <div class="modes" id="modes">
        <button class="mode is-active" data-mode="translate" type="button">翻译</button>
        <button class="mode" data-mode="guide" type="button">引导理解</button>
      </div>
      <div class="top-actions">
        <button id="btn-settings" type="button" title="模型设置">设置</button>
        <button id="btn-library" type="button" title="我的表达本">表达本</button>
        <button id="btn-clear" type="button" title="清空对话">清空</button>
        <button id="btn-log" type="button" title="打开日志文件">日志</button>
      </div>
    </header>

    <div class="notice" id="notice" hidden></div>

    <section class="drawer" id="settings-panel" hidden>
      <div class="drawer-head">
        <h2>模型设置</h2>
        <button id="btn-close-settings" type="button">关闭</button>
      </div>
      <p class="drawer-tip">信息只保存在本机,不会上传。</p>
      <label>API 地址<input id="cfg-base-url" type="url" spellcheck="false" placeholder="https://…/compatible-mode/v1"></label>
      <label>API Key<input id="cfg-api-key" type="password" autocomplete="off" spellcheck="false"></label>
      <label>翻译模型<input id="cfg-model" list="model-list" spellcheck="false" placeholder="例如 qwen-flash"></label>
      <label>学习模型(可选)<input id="cfg-learning" list="model-list" spellcheck="false" placeholder="引导理解与音标"></label>
      <datalist id="model-list"></datalist>
      <div class="drawer-actions">
        <button id="btn-discover" type="button">检测连接</button>
        <button id="btn-save-settings" class="primary" type="button">保存</button>
      </div>
      <p class="drawer-status" id="settings-status"></p>
      <div class="drawer-diag" id="diagnostics"></div>
    </section>

    <main class="stream" id="stream"></main>

    <footer class="composer">
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="粘贴或输入要翻译的内容…  选中文字后按热键可自动带入"></textarea>
        <div class="composer-actions">
          <div class="composer-left">
            <button id="btn-clear-input" type="button" title="清空输入框">清空输入</button>
            <span class="composer-hint" id="composer-hint">Ctrl+Enter 发送 · Enter 换行</span>
            <span class="char-count" id="char-count">0 字</span>
            <label class="mini-toggle"><input type="checkbox" id="opt-paste" checked>粘贴后自动翻译</label>
            <label class="mini-toggle"><input type="checkbox" id="opt-enter">Enter 发送</label>
          </div>
          <button id="btn-send" class="primary" type="button">翻译</button>
        </div>
      </div>
      <div class="statusbar" id="statusbar">就绪</div>
    </footer>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
