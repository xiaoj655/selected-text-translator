name: Build desktop apps

on:
  push:
    branches:
      - desktop
    tags:
      - 'desktop-v*'
    paths:
      - 'desktop/**'
      - 'src/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag matches package version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('desktop/package.json', 'utf8')).version")
          if [[ "${GITHUB_REF_NAME}" != "desktop-v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} must match desktop/package.json: desktop-v${version}" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Sync shared sources
        run: node desktop/scripts/sync-src.mjs

      - name: Smoke test
        working-directory: desktop
        run: npm run smoke

      - name: Build macOS x64
        if: matrix.name == 'macOS'
        working-directory: desktop
        run: npm run dist -- --mac --x64

      - name: Build macOS arm64
        if: matrix.name == 'macOS'
        working-directory: desktop
        run: npm run dist -- --mac --arm64

      - name: Build Windows installer
        if: matrix.name == 'Windows'
        working-directory: desktop
        run: npm run dist -- --win nsis --x64 --publish never

      - name: Build Windows ZIP
        if: matrix.name == 'Windows'
        working-directory: desktop
        run: npm run dist -- --win zip --x64 --publish never -c.directories.output=dist/portable

      - name: Verify Windows update artifacts
        if: matrix.name == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = Get-Item "dist/Selected.Text.Translator.Setup.$version.exe"
          Get-Item "$($installer.FullName).blockmap", dist/win-unpacked/resources/app-update.yml | Out-Null
          $sha512 = (Get-FileHash $installer.FullName -Algorithm SHA512).Hash
          $checksum = [Convert]::ToBase64String([Convert]::FromHexString($sha512))
          $manifest = Get-Content dist/latest.yml
          if ($manifest -cnotcontains "version: $version" -or
              $manifest -cnotcontains "path: $($installer.Name)" -or
              $manifest -cnotcontains "sha512: $checksum") {
            throw 'latest.yml must describe the packaged Windows installer.'
          }
          $portable = Get-Item dist/portable/*-win.zip
          $archive = [System.IO.Compression.ZipFile]::OpenRead($portable.FullName)
          try {
            if ($archive.Entries.Name -contains 'app-update.yml') {
              throw 'The Windows ZIP must not contain updater configuration.'
            }
          } finally {
            $archive.Dispose()
          }
          Move-Item $portable.FullName -Destination dist

      - name: Build Linux
        if: matrix.name == 'Linux'
        working-directory: desktop
        run: npm run dist -- --linux

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: selected-text-translator-${{ matrix.name }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/latest.yml
            desktop/dist/*.exe.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: List artifacts
        shell: bash
        run: ls -lh desktop/dist

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/desktop-v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: selected-text-translator-*
          path: desktop/dist
          merge-multiple: true

      - name: Generate checksums and release notes
        working-directory: desktop
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md
          cd dist
          sha256sum *.dmg *.exe *.zip *.AppImage *.exe.blockmap latest.yml > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: desktop/dist
        run: |
          sha256sum --check SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" *.dmg *.exe *.zip *.AppImage *.exe.blockmap SHA256SUMS.txt --clobber
            gh release upload "$RELEASE_TAG" latest.yml --clobber
          else
            gh release create "$RELEASE_TAG" *.dmg *.exe *.zip *.AppImage *.exe.blockmap latest.yml SHA256SUMS.txt \
              --title "桌面端 ${RELEASE_TAG#desktop-v}" \
              --notes-file ../release-notes.md \
              --verify-tag
          fi
