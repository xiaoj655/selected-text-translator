name: Build Android app

on:
  push:
    branches:
      - desktop
    tags:
      - 'android-v*'
    paths:
      - 'android/**'
      - 'src/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.apk.outputs.version }}
      version_code: ${{ steps.apk.outputs.version_code }}
    steps:
      - name: Require Android signing secrets
        if: startsWith(github.ref, 'refs/tags/android-v') && github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              missing+=("$secret")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "::error::Configure the missing Android release signing secrets in repository settings: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/**/gradle.properties
            android/**/gradle-wrapper.properties
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - name: Check and assemble Android release
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Sign release APK
        if: startsWith(github.ref, 'refs/tags/android-v') && github.event_name == 'push'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          keystore=$(mktemp)
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unset ANDROID_KEYSTORE_BASE64
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify signed release APK
        id: apk
        if: startsWith(github.ref, 'refs/tags/android-v') && github.event_name == 'push'
        working-directory: android
        run: |
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          apk=app/build/outputs/apk/release/app-release.apk
          package_id=io.github.selectedtext.translator
          package_line=$("$build_tools/aapt" dump badging "$apk" | sed -n '/^package: /p')
          if [[ "$package_line" != "package: name='$package_id' "* ]]; then
            echo "APK package name must be $package_id" >&2
            exit 1
          fi
          version=$(sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" <<< "$package_line")
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Cannot read a valid Android version from $apk" >&2
            exit 1
          fi
          version_code=$(sed -n "s/^package: .*versionCode='\([^']*\)'.*/\1/p" <<< "$package_line")
          if [[ ! $version_code =~ ^[1-9][0-9]*$ ]]; then
            echo "Cannot read a valid Android version code from $apk" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "android-v$version" ]]; then
            echo "Release tag must match the APK version: android-v$version" >&2
            exit 1
          fi
          "$build_tools/apksigner" verify --print-certs "$apk"
          name="selected-text-translator-android-$version.apk"
          mkdir -p dist
          cp "$apk" "dist/$name"
          cd dist
          checksum=$(sha256sum "$name")
          printf '%s\n' "$checksum" > SHA256SUMS.txt
          jq -n --arg applicationId "$package_id" --arg versionName "$version" \
            --argjson versionCode "$version_code" --arg fileName "$name" \
            --arg sha256 "${checksum%% *}" --argjson bytes "$(stat --format=%s "$name")" \
            '$ARGS.named' > update.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: startsWith(github.ref, 'refs/tags/android-v') && github.event_name == 'push'
        with:
          name: selected-text-translator-android-${{ steps.apk.outputs.version }}
          path: |
            android/dist/*.apk
            android/dist/SHA256SUMS.txt
            android/dist/update.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/android-v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: selected-text-translator-android-${{ needs.build.outputs.version }}
          path: android/dist

      - name: Publish Android APK
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          apk_name="selected-text-translator-android-$VERSION.apk"
          (cd dist && sha256sum --check SHA256SUMS.txt)
          checksum=$(sha256sum "dist/$apk_name")
          jq -e --arg version "$VERSION" --arg name "$apk_name" \
            --argjson versionCode "$VERSION_CODE" \
            --arg sha256 "${checksum%% *}" --argjson bytes "$(stat --format=%s "dist/$apk_name")" \
            '.applicationId == "io.github.selectedtext.translator" and .versionName == $version
             and .versionCode == $versionCode and .fileName == $name and .sha256 == $sha256 and .bytes == $bytes' \
            dist/update.json > /dev/null
          assets=("dist/$apk_name" dist/SHA256SUMS.txt dist/update.json)
          if release_assets=$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease,assets 2>/dev/null); then
            for asset in "${assets[@]}"; do
              if ! jq -e --arg name "${asset##*/}" \
                '.isDraft == false and .isPrerelease == false and any(.assets[]; .name == $name and .state == "uploaded")' \
                <<< "$release_assets" > /dev/null; then
                echo "::error::Existing $GITHUB_REF_NAME release is unpublished, a prerelease, or missing ${asset##*/}"
                exit 1
              fi
            done
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          awk -v heading="## $VERSION" '
            $0 == heading { selected = 1; next }
            selected && /^## / { exit }
            selected { print }
          ' CHANGELOG.md > dist/release-notes.md
          if [[ ! -s dist/release-notes.md ]]; then
            echo "Missing changelog for Android $VERSION" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "Android $VERSION" --notes-file dist/release-notes.md --latest=false --verify-tag
