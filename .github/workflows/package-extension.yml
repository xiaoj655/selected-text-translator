name: Verify and package extension

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Read version and validate release tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('manifest.json', 'utf8')).version)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
            echo "Release tag must match manifest.json: v$version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Verify browser interactions with local mock API
        run: npm run test:browser
        env:
          STT_ARTIFACT_DIR: ${{ runner.temp }}/selected-browser-preview
      - run: npm run package:extension
      - name: Generate archive checksum
        run: |
          cd dist
          sha256sum selected-text-translator-*.zip > SHA256SUMS.txt
      - name: Upload installable extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: selected-text-translator-${{ steps.version.outputs.version }}
          path: |
            dist/selected-text-translator-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload browser previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-previews
          path: ${{ runner.temp }}/selected-browser-preview/
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: selected-text-translator-${{ needs.package.outputs.version }}
          path: dist
      - name: Publish versioned ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" selected-text-translator-*.zip SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" selected-text-translator-*.zip SHA256SUMS.txt --verify-tag --generate-notes
          fi
