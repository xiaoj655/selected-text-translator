<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Selected · 设置</title>
    <link rel="icon" href="../assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body class="options">
    <header class="settings-header">
      <div class="brand"><img class="brand-mark" src="../assets/icon.svg" alt="" width="32" height="32" /><div class="brand-name">Selected</div></div>
      <a href="library.html" class="navigation-link">我的表达本 →</a>
    </header>
    <main>
      <h1>设置</h1>
      <p class="intro">管理模型连接、阅读偏好与朗读。</p>
      <form id="settings-form">
        <div class="settings-grid">
          <section class="panel">
            <div class="panel-heading"><h2>连接模型</h2></div>
            <label class="field" for="base_url">API 地址<input id="base_url" name="base_url" type="url" placeholder="https://api.example.com/v1" autocapitalize="none" autocorrect="off" spellcheck="false" required /></label>
            <label class="field" for="api_key">API Key<input id="api_key" name="api_key" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" required /></label>
            <button id="discover-models" type="button" class="secondary">检测连接并获取模型</button>
            <p id="connection-status" class="status help" role="status" aria-live="polite"></p>
            <datalist id="provider-models"></datalist><datalist id="learning-models"></datalist>
            <label class="field" for="model">翻译模型<input id="model" name="model" list="provider-models" type="text" placeholder="qwen-mt-flash" autocapitalize="none" autocorrect="off" spellcheck="false" required /></label>
            <label class="field" for="learning_model">学习模型<input id="learning_model" name="learning_model" list="learning-models" type="text" placeholder="可用的通用模型名称" autocapitalize="none" autocorrect="off" spellcheck="false" aria-describedby="learning-model-help" /><span id="learning-model-help" class="help">用于音标与英文引导，共用 API 地址和密钥。翻译使用通用模型时可留空；qwen-mt 需要另外填写。</span></label>
          </section>
          <section class="panel">
            <div class="panel-heading"><h2>阅读与声音</h2></div>
            <label class="field" for="reading_mode">划词后的默认模式<select id="reading_mode" name="reading_mode"><option value="translate">直接翻译</option><option value="guide">英文引导 · 逐层提示</option></select><span class="help">阅读卡片内也可以切换，自动记住选择。</span></label>
            <label class="field" for="speech_voice">朗读音色<select id="speech_voice" name="speech_voice"><option value="">自动选择</option></select></label>
            <div class="row voice-row"><label class="field" for="speech_rate">语速<select id="speech_rate" name="speech_rate"><option value="0.75">慢速 · 0.75×</option><option value="0.9" selected>舒缓 · 0.9×</option><option value="1">正常 · 1×</option><option value="1.2">稍快 · 1.2×</option></select></label><button id="preview-speech" type="button" class="secondary">试听声音</button></div>
            <p id="speech-status" class="status help" role="status" aria-live="polite"></p>
            <p class="help">使用系统或已安装的语音引擎。标注「在线」的音色需要联网。</p>
          </section>
        </div>
        <details class="panel advanced-settings">
          <summary class="provider-summary">调试日志</summary>
          <div class="row debug-row"><label class="toggle-label" for="debug_logging_enabled"><input id="debug_logging_enabled" name="debug_logging_enabled" type="checkbox" />启用调试日志</label><button id="disable-logs" type="button" class="secondary">关闭日志</button></div>
          <p class="help">默认关闭，仅记录请求状态与长度，不记录选区正文。</p>
        </details>
        <div class="row save-row"><button type="submit">保存设置</button><p id="status" class="status" role="status" aria-live="polite"></p></div>
      </form>
      <section class="panel blacklist-section">
        <div class="panel-heading"><h2>停用的网站与路径</h2></div>
        <p class="blacklist-description">在这些地址及其子路径下隐藏划词入口。</p>
        <div id="blacklist-list"></div>
        <div class="blacklist-add-row"><input id="blacklist-input" name="blacklist-input" type="url" aria-label="要停用的地址" placeholder="https://example.com/path" autocapitalize="none" autocorrect="off" spellcheck="false" /><button id="blacklist-add" type="button">添加</button></div>
        <button id="blacklist-add-current" type="button" class="text-button">添加当前网页</button>
      </section>
    </main>
    <footer class="footer"><span>划词后，悬停或点击图标开始阅读。</span><span><kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>E</kbd></span></footer>
    <script src="options.js" type="module"></script>
  </body>
</html>
