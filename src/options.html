<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Translation Settings</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        padding: 24px;
        background: #f3f5f2;
        color: #111;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }

      .panel {
        max-width: 520px;
        background: #fff;
        border: 2px solid #111;
        box-shadow: 6px 6px 0 #111;
        padding: 18px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 20px;
      }

      form {
        display: grid;
        gap: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
      }

      input {
        border: 2px solid #111;
        border-radius: 0;
        padding: 9px 10px;
        font-size: 13px;
      }

      input[type='checkbox'] {
        width: 16px;
        height: 16px;
        margin: 0;
        padding: 0;
      }

      button {
        border: 2px solid #111;
        background: #19b84a;
        color: #111;
        font-size: 13px;
        font-weight: 700;
        padding: 10px 12px;
        cursor: pointer;
      }

      button.secondary {
        background: #efefef;
      }

      .toggle-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }

      .status {
        min-height: 18px;
        margin: 0;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <section class="panel">
      <h1>Selected Text Translation</h1>
      <form id="settings-form">
        <label>
          Base URL
          <input id="base_url" name="base_url" type="url" placeholder="https://api.example.com/v1" required />
        </label>

        <label>
          API Key
          <input id="api_key" name="api_key" type="password" autocomplete="off" required />
        </label>

        <label>
          Model
          <input id="model" name="model" type="text" placeholder="qwen-mt-turbo" required />
        </label>

        <label class="toggle-label">
          <input id="debug_logging_enabled" name="debug_logging_enabled" type="checkbox" />
          Enable debug logging
        </label>

        <button type="submit">Save settings</button>
        <button id="disable-logs" class="secondary" type="button">One-click disable logs</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <script src="options.js" type="module"></script>
  </body>
</html>
